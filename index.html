<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صانع قوالب موسوعة البصرة - الريلز والصور</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-[#121212] text-white min-h-screen p-4 flex flex-col items-center">

    <!-- رأس الصفحة العام -->
    <header class="w-full max-w-md text-center mb-4">
        <div class="flex items-center justify-between bg-neutral-900 border border-neutral-800 px-4 py-2.5 rounded-2xl shadow-lg">
            <div class="flex items-center gap-2">
                <span class="bg-amber-500 text-black text-[10px] font-black px-2 py-0.5 rounded">بص</span>
                <span class="text-xs font-bold text-slate-200">صانع قوالب موسوعة البصرة</span>
            </div>
            <span class="text-[10px] text-amber-400">تحكم بالصور والنصوص 🖼️</span>
        </div>
    </header>

    <!-- حاوية العرض الرئيسية -->
    <main class="w-full max-w-md flex flex-col items-center gap-5">

        <!-- 📱 معاينة قالب الموبايل (الريلز 9:16) -->
        <div class="w-full max-w-[300px] bg-black border-[8px] border-neutral-800 rounded-[35px] overflow-hidden shadow-2xl relative flex flex-col justify-between">
            
            <!-- كاميرا الهاتف العلوي -->
            <div class="absolute top-0 left-1/2 -translate-x-1/2 w-24 h-4 bg-neutral-800 rounded-b-xl z-20"></div>

            <!-- محتوى الشاشة -->
            <div class="relative text-white pt-9 pb-3 px-3.5 flex flex-col justify-between min-h-[520px] overflow-hidden">
                
                <!-- خلفية الصورة -->
                <div class="absolute inset-0 z-0">
                    <img id="previewBgImg" src="https://images.unsplash.com/photo-1517649763962-0c623266cf20?auto=format&fit=crop&q=80&w=800" alt="خلفية" class="w-full h-full object-cover">
                    <div class="absolute inset-0 bg-gradient-to-b from-[#0b1329]/85 via-[#0b1329]/95 to-[#0b1329]"></div>
                </div>

                <!-- المحتوى العلوي -->
                <div class="relative z-10">
                    <!-- الشريط العلوي (شعار وبطاقة) -->
                    <div class="flex justify-between items-start mb-4">
                        <div class="bg-white rounded-xl p-1.5 shadow-lg flex flex-col items-center w-12 h-12 justify-center">
                            <span class="text-black font-black text-[11px]">بص</span>
                            <span class="text-[7px] text-slate-600 font-bold">موسوعة البصرة</span>
                        </div>
                        <div class="bg-red-600/90 text-white text-[9px] font-bold px-2 py-0.5 rounded-full flex items-center gap-1 shadow">
                            <span class="w-1.5 h-1.5 rounded-full bg-white animate-pulse"></span>
                            REEL
                        </div>
                    </div>

                    <!-- التصنيف -->
                    <div class="flex justify-center mb-2">
                        <span id="previewCategory" class="bg-amber-500/20 border border-amber-500/40 text-amber-400 text-[10px] font-bold px-2.5 py-0.5 rounded-full">
                            رياضة | الميناء
                        </span>
                    </div>

                    <!-- عنوان الخبر -->
                    <h2 id="previewTitle" class="text-center text-sm font-black leading-snug mb-3 text-white drop-shadow-md">
                        اكتبي عنوان الخبر هنا...
                    </h2>

                    <!-- صندوق التفاصيل -->
                    <div id="previewBox" class="bg-black/40 backdrop-blur-md border border-amber-500/30 rounded-xl p-2.5 text-[10px] space-y-1.5 shadow-xl">
                        <div class="flex items-center justify-between border-b border-white/10 pb-1">
                            <span class="text-slate-200">النقطة الأولى هنا...</span>
                            <span class="w-1.5 h-1.5 rounded-full bg-amber-400"></span>
                        </div>
                        <div class="flex items-center justify-between">
                            <span class="text-slate-200">النقطة الثانية هنا...</span>
                            <span class="w-1.5 h-1.5 rounded-full bg-amber-400"></span>
                        </div>
                    </div>
                </div>

                <!-- التذييل -->
                <div class="relative z-10 mt-3 pt-2 border-t border-white/10 flex justify-between items-center text-[9px]">
                    <div>
                        <span id="previewFooterLeft" class="font-bold text-amber-400 block">AL-MINA'A SC</span>
                        <span class="text-slate-400">2025 / 2026</span>
                    </div>
                    <div class="text-center bg-white/10 p-1 rounded-full w-6 h-6 flex items-center justify-center">
                        ⚽
                    </div>
                    <div class="text-left">
                        <span class="font-bold block text-white">موسوعة البصرة</span>
                        <span class="text-slate-400 text-[8px]">BASRA ENCYCLOPEDIA</span>
                    </div>
                </div>

            </div>
        </div>

        <!-- ✍️ لوحة التحكم والصور -->
        <div class="w-full bg-neutral-900 border border-neutral-800 rounded-2xl p-4 shadow-xl space-y-3">
            <h3 class="text-xs font-bold text-amber-400 border-b border-neutral-800 pb-2">لوحة إدخال النصوص وتغيير الصور</h3>
            
            <!-- اختيار القسم الجاهز -->
            <div>
                <label class="block text-[11px] text-slate-400 mb-1">اختر نوع القالب الأساسي:</label>
                <select id="templateSelect" onchange="changeTemplateType()" class="w-full bg-neutral-950 border border-neutral-800 text-white text-xs rounded-xl p-2.5 outline-none focus:border-amber-500">
                    <option value="sport">🟡 رياضة (الميناء)</option>
                    <option value="services">🟢 خدمات عامة</option>
                    <option value="weather">🔵 طقس البصرة</option>
                    <option value="urgent">🔴 خبر عاجل</option>
                </select>
            </div>

            <!-- 🖼️ إدخال رابط أو اختيار صورة سريعة -->
            <div>
                <label class="block text-[11px] text-slate-400 mb-1">رابط صورة الخلفية (أو اختاري من الأزرار أدناه):</label>
                <input type="text" id="inputBgUrl" oninput="updatePreview()" class="w-full bg-neutral-950 border border-neutral-800 text-white text-xs rounded-xl p-2.5 outline-none focus:border-amber-500 mb-2" placeholder="ضعي رابط الصورة هنا...">
                
                <!-- أزرار صور جاهزة بنقرة واحدة -->
                <div class="grid grid-cols-3 gap-1.5">
                    <button onclick="setBgImage('https://images.unsplash.com/photo-1517649763962-0c623266cf20?auto=format&fit=crop&q=80&w=800')" class="bg-neutral-800 hover:bg-neutral-700 text-[10px] py-1.5 rounded-lg text-slate-300">⚽ فريق / رياضة</button>
                    <button onclick="setBgImage('https://images.unsplash.com/photo-1541888946425-d0fbb18f7294?auto=format&fit=crop&q=80&w=800')" class="bg-neutral-800 hover:bg-neutral-700 text-[10px] py-1.5 rounded-lg text-slate-300">💧 خدمات / ماء</button>
                    <button onclick="setBgImage('https://images.unsplash.com/photo-1592210454359-9043f067919b?auto=format&fit=crop&q=80&w=800')" class="bg-neutral-800 hover:bg-neutral-700 text-[10px] py-1.5 rounded-lg text-slate-300">☀️ طقس / شمس</button>
                </div>
            </div>

            <!-- إدخال التصنيف الفرعي -->
            <div>
                <label class="block text-[11px] text-slate-400 mb-1">التصنيف العلوي:</label>
                <input type="text" id="inputCategory" oninput="updatePreview()" class="w-full bg-neutral-950 border border-neutral-800 text-white text-xs rounded-xl p-2.5 outline-none focus:border-amber-500" value="رياضة | الميناء">
            </div>

            <!-- إدخال عنوان الخبر -->
            <div>
                <label class="block text-[11px] text-slate-400 mb-1">عنوان الخبر الرئيسي:</label>
                <textarea id="inputTitle" oninput="updatePreview()" rows="2" class="w-full bg-neutral-950 border border-neutral-800 text-white text-xs rounded-xl p-2.5 outline-none focus:border-amber-500">العيداني يصرف مليار ونصف للاعبي الميناء مع توفير طائرة خاصة وتجهيز أديداس</textarea>
            </div>

            <!-- إدخال تفاصيل الصندوق -->
            <div>
                <label class="block text-[11px] text-slate-400 mb-1">تفاصيل الصندوق (كل سطر نقطة):</label>
                <textarea id="inputDetails" oninput="updatePreview()" rows="3" class="w-full bg-neutral-950 border border-neutral-800 text-white text-xs rounded-xl p-2.5 outline-none focus:border-amber-500">طائرة خاصة للفريق
تجهيز أديداس الرياضي
معسكر خارجي وتأهيل الملعب</textarea>
            </div>

            <!-- زر النسخ -->
            <button onclick="copyFinalText()" class="w-full bg-amber-500 hover:bg-amber-600 text-black font-bold text-xs py-3 rounded-xl transition shadow-lg flex items-center justify-center gap-1.5 mt-2">
                📋 نسخ النص الجاهز للنشر
            </button>
        </div>

    </main>

    <!-- البرمجة التفاعلية -->
    <script>
        const presets = {
            sport: {
                cat: "رياضة | الميناء",
                title: "العيداني يصرف مليار ونصف للاعبي الميناء مع توفير طائرة خاصة وتجهيز أديداس",
                details: "طائرة خاصة للفريق\nتجهيز أديداس الرياضي\nمعسكر خارجي وتأهيل الملعب",
                bg: "https://images.unsplash.com/photo-1517649763962-0c623266cf20?auto=format&fit=crop&q=80&w=800"
            },
            services: {
                cat: "خدمات عامة",
                title: "انقطاع مبرمج للماء في مناطق الجبيلة والطويسة من الساعة 8 صباحاً حتى 3 عصراً",
                details: "المناطق: الجبيلة، الطويسة\nالوقت: 8 صباحاً - 3 عصراً\nالسبب: صيانة دورية لشبكة الماء",
                bg: "https://images.unsplash.com/photo-1541888946425-d0fbb18f7294?auto=format&fit=crop&q=80&w=800"
            },
            weather: {
                cat: "طقس البصرة",
                title: "تنبيه جوي: أجواء مغبرة ودرجة حرارة مرتفعة تسجلها المحافظة اليوم تصل إلى 47 مئوية",
                details: "الرطوبة: 18%\nالرياح: 22 كم\nالرؤية: 3 كم",
                bg: "https://images.unsplash.com/photo-1592210454359-9043f067919b?auto=format&fit=crop&q=80&w=800"
            },
            urgent: {
                cat: "عاجل الآن",
                title: "اندلاع حريق كبير في منطقة العشار وسط البصرة وفرق الدفاع المدني تهرع للمكان",
                details: "غرفة أخبار الموسوعة تتابع التفاصيل أولاً باول",
                bg: "https://images.unsplash.com/photo-1508873696983-2df5c920ac1c?auto=format&fit=crop&q=80&w=800"
            }
        };

        function changeTemplateType() {
            const val = document.getElementById('templateSelect').value;
            const p = presets[val];
            document.getElementById('inputCategory').value = p.cat;
            document.getElementById('inputTitle').value = p.title;
            document.getElementById('inputDetails').value = p.details;
            document.getElementById('inputBgUrl').value = p.bg;
            document.getElementById('previewBgImg').src = p.bg;
            updatePreview();
        }

        function setBgImage(url) {
            document.getElementById('inputBgUrl').value = url;
            document.getElementById('previewBgImg').src = url;
        }

        function updatePreview() {
            const cat = document.getElementById('inputCategory').value;
            const title = document.getElementById('inputTitle').value;
            const detailsRaw = document.getElementById('inputDetails').value;
            const bgUrl = document.getElementById('inputBgUrl').value;

            document.getElementById('previewCategory').innerText = cat;
            document.getElementById('previewTitle').innerText = title;
            if(bgUrl.trim() !== '') {
                document.getElementById('previewBgImg').src = bgUrl;
            }

            const lines = detailsRaw.split('\n').filter(l => l.trim() !== '');
            let boxHtml = '';
            lines.forEach((line, index) => {
                const isLast = index === lines.length - 1;
                boxHtml += `
                    <div class="flex items-center justify-between ${!isLast ? 'border-b border-white/10 pb-1' : ''}">
                        <span class="text-slate-200">${line}</span>
                        <span class="w-1.5 h-1.5 rounded-full bg-amber-400"></span>
                    </div>
                `;
            });
            document.getElementById('previewBox').innerHTML = boxHtml;
        }

        function copyFinalText() {
            const cat = document.getElementById('inputCategory').value;
            const title = document.getElementById('inputTitle').value;
            const details = document.getElementById('inputDetails').value;

            const finalString = `موسوعة البصرة | ${cat}\n\n${title}\n\n${details}\n\n#موسوعة_البصرة #البصرة`;
            
            navigator.clipboard.writeText(finalString).then(() => {
                alert('تم نسخ النص جاهزاً للنشر!');
            });
        }

        // تعيين القيمة الافتراضية للرابط عند التحميل
        document.getElementById('inputBgUrl').value = presets.sport.bg;
        updatePreview();
    </script>

</body>
</html>
