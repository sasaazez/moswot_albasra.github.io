<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موسوعة البصرة - أخبار الرياضة</title>
    <!-- استخدام Tailwind CSS للتصميم السريع والنظيف -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');
        body {
            font-family: 'Cairo', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-950 flex justify-center items-center min-h-screen p-4">

    <!-- حاوية القالب (بمقاسات تناسب التصميم الطولي) -->
    <div class="w-full max-w-sm bg-[#0b1329] border border-slate-800 rounded-2xl overflow-hidden shadow-2xl relative flex flex-col justify-between">
        
        <!-- القسم العلوي: الصورة والوسم -->
        <div>
            <!-- صورة الخبر (يمكنك استبدال رابط الصورة بصورة الخبر الفعلي) -->
            <div class="relative w-full h-56 bg-slate-800">
                <img src="https://images.unsplash.com/photo-1508098682722-e99c43a406b2?q=80&w=1000&auto=format&fit=crop" alt="صورة الخبر" class="w-full h-full object-cover opacity-90">
                
                <!-- شعار المنصة في الأعلى (مربوط مع ملف Logo.png لديك) -->
                <div class="absolute top-3 left-3 bg-white/90 backdrop-blur px-3 py-1.5 rounded-xl flex items-center gap-2 shadow">
                    <img src="Logo.png" alt="شعار موسوعة البصرة" class="w-5 h-5 object-contain">
                    <span class="text-xs font-bold text-slate-900">موسوعة البصرة</span>
                </div>
            </div>

            <!-- محتوى الخبر -->
            <div class="p-5">
                <!-- التصنيف -->
                <div class="mb-3">
                    <span class="bg-[#d4af37]/20 text-[#d4af37] border border-[#d4af37]/30 text-xs font-semibold px-3 py-1 rounded-full">
                        رياضة | الميناء
                    </span>
                </div>

                <!-- العنوان الرئيسي -->
                <h2 class="text-white text-2xl font-black leading-snug mb-6">
                    العيداني يصرف مليار ونصف للاعبي الميناء
                </h2>

                <!-- قائمة النقاط -->
                <ul class="space-y-3 text-slate-300 text-sm">
                    <li class="flex items-center justify-between border-b border-slate-800/60 pb-2">
                        <span>طائرة خاصة</span>
                        <span class="w-2 h-2 rounded-full bg-[#d4af37]"></span>
                    </li>
                    <li class="flex items-center justify-between border-b border-slate-800/60 pb-2">
                        <span>تجهيز أديداس</span>
                        <span class="w-2 h-2 rounded-full bg-[#d4af37]"></span>
                    </li>
                    <li class="flex items-center justify-between border-b border-slate-800/60 pb-2">
                        <span>معسكر خارجي</span>
                        <span class="w-2 h-2 rounded-full bg-[#d4af37]"></span>
                    </li>
                    <li class="flex items-center justify-between border-b border-slate-800/60 pb-2">
                        <span>مكافأة بعد كل فوز</span>
                        <span class="w-2 h-2 rounded-full bg-[#d4af37]"></span>
                    </li>
                    <li class="flex items-center justify-between pb-1">
                        <span>تأهيل ملعب الميناء الأولمبي</span>
                        <span class="w-2 h-2 rounded-full bg-[#d4af37]"></span>
                    </li>
                </ul>
            </div>
        </div>

        <!-- التذييل السفلي (Footer) -->
        <div class="px-5 py-4 bg-[#070d1d] border-t border-slate-800 flex justify-between items-center text-xs text-slate-400">
            <div>
                <p class="font-bold text-slate-300">AL-MINA'A SC</p>
                <p class="text-[10px] text-slate-500">2025 / 2026</p>
            </div>
            <div class="text-left">
                <p class="font-bold text-slate-300">موسوعة البصرة</p>
                <p class="text-[10px] text-slate-500">BASRA ENCYCLOPEDIA</p>
            </div>
        </div>

    </div>

</body>
</html>
