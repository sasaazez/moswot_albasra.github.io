<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قوالب موسوعة البصرة الاحترافية - ريلز</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #f4f4f4; color: #333; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        h1 { margin-bottom: 20px; font-size: 22px; color: #111; text-align: center; }
        
        .container { display: flex; flex-direction: column; gap: 40px; width: 100%; max-width: 420px; }
        
        .template-card { background: #fff; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); overflow: hidden; padding-bottom: 15px; }
        .template-header { padding: 10px 15px; background: #eee; font-size: 14px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        
        /* Phone Frame (9:16 Ratio - Reels Format) */
        .phone-frame {
            width: 100%;
            aspect-ratio: 9/16;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: linear-gradient(180deg, #1a0000 0%, #0d0d0d 100%);
            color: #fff;
        }

        /* Top Bar with Date & Time */
        .top-bar-standard {
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            font-size: 12px;
            background: linear-gradient(90deg, #cc0000, #880000);
            color: #fff;
            z-index: 10;
        }
        
        .logo-area { display: flex; align-items: center; gap: 6px; }
        .logo-img { width: 28px; height: 28px; background: #fff; border-radius: 50%; padding: 2px; object-fit: contain; }

        /* 75% Image Container & 25% Overlay Text Area */
        .media-container {
            position: relative;
            width: 100%;
            height: 72%;
            overflow: hidden;
        }

        .hero-news-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Gradient Overlay on image for text readability */
        .overlay-gradient {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(0deg, rgba(0,0,0,0.9) 10%, rgba(0,0,0,0.4) 50%, rgba(0,0,0,0.1) 100%);
        }

        .content-over-image {
            position: absolute;
            bottom: 15px;
            left: 15px;
            right: 15px;
            z-index: 5;
        }

        .tag {
            background: #cc0000;
            color: white;
            padding: 4px 10px;
            font-size: 12px;
            border-radius: 4px;
            width: fit-content;
            margin-bottom: 8px;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        .phone-frame h2 {
            font-size: 26px; /* Optimized for Reels */
            line-height: 1.35;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 2px 8px rgba(0,0,0,0.9);
        }

        /* Footer Info */
        .footer-box {
            background: rgba(0, 0, 0, 0.8);
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        /* Control Inputs Area */
        .controls { padding: 12px 15px; display: flex; flex-direction: column; gap: 8px; background: #fff; border-top: 1px solid #eee; }
        .controls label { font-size: 11px; font-weight: bold; color: #555; display: flex; align-items: center; gap: 6px; cursor: pointer; }
        .controls textarea, .controls input[type="text"] { width: 100%; padding: 7px; border: 1px solid #ccc; border-radius: 6px; font-size: 12px; font-family: inherit; resize: vertical; }
        .controls input[type="file"] { font-size: 11px; padding: 4px; background: #f9f9f9; border: 1px dashed #cc0000; border-radius: 6px; cursor: pointer; }
        .controls input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; }
    </style>
</head>
<body>

    <h1>قوالب موسوعة البصرة الاحترافية - ريلز</h1>

    <div class="container">

        <!-- Template 01: Red / Black (Optimized for Reels) -->
        <div class="template-card">
            <div class="template-header"><span>REELS TEMPLATE - عاجل</span><span style="color:red">RED / BLACK PRO</span></div>
            <div class="phone-frame">
                
                <!-- Top Bar with Logo, Name & Date/Time -->
                <div class="top-bar-standard">
                    <div class="logo-area">
                        <img src="Logo.png" class="logo-img" alt="شعار">
                        <span>موسوعة البصرة</span>
                    </div>
                    <span id="out-top-date">الثلاثاء 2026/9/8 - 9:30 ص</span>
                </div>

                <!-- 75% Image Section with Text Overlay -->
                <div class="media-container">
                    <img src="https://images.unsplash.com/photo-1541872703-74c5e44368f9?w=500" class="hero-news-img" id="img-t1" alt="صورة الخبر">
                    <div class="overlay-gradient"></div>
                    
                    <div class="content-over-image">
                        <div class="tag" id="badge-t1">خبر عاجل</div>
                        <h2 id="out-t1-text">وصول القنصل الايراني الجديد مصطفى الطرفي الى البصرة</h2>
                    </div>
                </div>

                <!-- Footer Location -->
                <div class="footer-box">
                    <span>البصرة 📍 Al-Basra</span>
                    <span style="color: #ff4d4d; font-weight: bold;">🔴 مباشر</span>
                </div>
            </div>

            <!-- Controls -->
            <div class="controls">
                <label><input type="checkbox" checked onchange="toggleBadge(this, 'badge-t1')"> إظهار كلمة "خبر عاجل"</label>
                <label>اختر صورة الخبر من الاستديو / الملفات:</label>
                <input type="file" accept="image/*" onchange="loadFile(event, 'img-t1')">
                <label>أو رابط الصورة:</label>
                <input type="text" value="https://images.unsplash.com/photo-1541872703-74c5e44368f9?w=500" oninput="document.getElementById('img-t1').src = this.value">
                <label>نص الخبر (خط كبير بارز):</label>
                <textarea rows="2" oninput="document.getElementById('out-t1-text').innerText = this.value">وصول القنصل الايراني الجديد مصطفى الطرفي الى البصرة</textarea>
                <label>التاريخ والوقت في الأعلى:</label>
                <input type="text" value="الثلاثاء 2026/9/8 - 9:30 ص" oninput="document.getElementById('out-top-date').innerText = this.value">
            </div>
        </div>

    </div>

    <script>
        function loadFile(event, imgId) {
            const imageTag = document.getElementById(imgId);
            if (event.target.files && event.target.files[0]) {
                imageTag.src = URL.createObjectURL(event.target.files[0]);
            }
        }

        function toggleBadge(checkbox, tagId) {
            const tagEl = document.getElementById(tagId);
            if(tagEl) tagEl.style.display = checkbox.checked ? 'inline-block' : 'none';
        }
    </script>

</body>
</html>
